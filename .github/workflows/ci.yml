name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests and syntax check
        run: npm test

  db-security:
    # Applies security migrations to a throwaway Postgres with a minimal
    # Supabase stand-in, then runs attacks and app paths as real roles.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Profiles security test
        run: |
          bash tests/sql/profiles-security.sh
          bash tests/sql/ai-quota-security.sh
          bash tests/sql/maintenance-rpc-security.sh
          IRONZ_PROFILE_UPGRADE=1 bash tests/sql/profiles-security.sh
