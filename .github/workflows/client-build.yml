name: Client build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client packaging
        run: node tests/client-build.test.js
